<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Background for Android Maskable Icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Subtle Circular Aura -->
  <circle cx="256" cy="240" r="140" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="14"/>
  <circle cx="256" cy="240" r="180" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="8"/>

  <!-- Sound Waves (Left) -->
  <path d="M 140 200 A 55 55 0 0 0 140 280" fill="none" stroke="url(#waveGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 115 170 A 90 90 0 0 0 115 310" fill="none" stroke="url(#waveGrad)" stroke-width="10" stroke-linecap="round" opacity="0.75"/>

  <!-- Sound Waves (Right) -->
  <path d="M 372 200 A 55 55 0 0 1 372 280" fill="none" stroke="url(#waveGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 397 170 A 90 90 0 0 1 397 310" fill="none" stroke="url(#waveGrad)" stroke-width="10" stroke-linecap="round" opacity="0.75"/>

  <!-- Microphone Center Capsule -->
  <rect x="220" y="160" width="72" height="135" rx="36" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- Microphone Stand U-Shape -->
  <path d="M 195 240 A 61 61 0 0 0 317 240" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Stand Stem and Base -->
  <line x1="256" y1="301" x2="256" y2="345" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <line x1="210" y1="345" x2="302" y2="345" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>

  <!-- Tamil Letter Badge at Bottom (த) -->
  <g transform="translate(256, 420)">
    <rect x="-85" y="-30" width="170" height="52" rx="26" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <text x="0" y="7" font-family="-apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">TAMIL TTS</text>
  </g>
</svg>
